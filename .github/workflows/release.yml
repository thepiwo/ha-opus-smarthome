name: Validate Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install and test
        run: |
          uv sync --all-extras
          uv run pytest -v
      - name: Validate HACS
        uses: hacs/action@main
        with:
          category: integration
